name: PDF Fire - Windows

# Builds PDF Fire for Windows (x64) on GitHub's Windows machines: the program folder,
# with the natural voices and the English text-recognition data, as a download.
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 180
    env:
      VCPKG_INSTALLED_DIR: ${{ github.workspace }}\vcpkg_installed
      VCPKG_ROOT: ${{ github.workspace }}\vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg-binary-cache
      PDFFIRE_WORK_DIR: ${{ github.workspace }}\work

    steps:
      - name: Checkout PDF Fire
        uses: actions/checkout@v4
        with:
          path: pdf-fire

      - name: Natural voices and ONNX Runtime (pinned downloads)
        shell: pwsh
        run: python pdf-fire\pdf-fire\scripts\fetch-voice-data.py

      - name: English text-recognition data (tessdata_fast, pinned)
        shell: pwsh
        run: |
          $dir = Join-Path $env:PDFFIRE_WORK_DIR 'deps\tessdata'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $file = Join-Path $dir 'eng.traineddata'
          Invoke-WebRequest -MaximumRetryCount 5 -RetryIntervalSec 15 -Uri 'https://github.com/tesseract-ocr/tessdata_fast/raw/4.1.0/eng.traineddata' -OutFile $file
          $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne '7d4322bd2a7749724879683fc3912cb542f19906c83bcc1a52132556427170b2') { throw "eng.traineddata checksum mismatch: $hash" }
          # Tesseract's glyph-less font: the invisible text layer of a recognized page
          $font = Join-Path $dir 'pdf.ttf'
          Invoke-WebRequest -MaximumRetryCount 5 -RetryIntervalSec 15 -Uri 'https://raw.githubusercontent.com/tesseract-ocr/tesseract/5.5.1/tessdata/pdf.ttf' -OutFile $font
          $hash = (Get-FileHash $font -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne 'c7845420925a23d88ed830a63957b8af85a66a8daf8d9fc90e843673b2ef1a59') { throw "pdf.ttf checksum mismatch: $hash" }

      - name: 'vcpkg: set up'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          git clone --depth=1 https://github.com/microsoft/vcpkg.git
          .\vcpkg\bootstrap-vcpkg.bat -disableMetrics

      - name: 'vcpkg: restore the built libraries'
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}\vcpkg-binary-cache
          key: ${{ runner.os }}-pdffire-vcpkg-${{ hashFiles('pdf-fire/vcpkg.json') }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-pdffire-vcpkg-${{ hashFiles('pdf-fire/vcpkg.json') }}-
            ${{ runner.os }}-pdffire-vcpkg-

      - name: 'vcpkg: libraries (Tesseract, OpenSSL, FreeType, ...)'
        shell: pwsh
        working-directory: vcpkg
        run: |
          $manifestRoot = Join-Path $env:GITHUB_WORKSPACE 'pdf-fire'
          .\vcpkg install --triplet x64-windows --x-manifest-root=$manifestRoot --x-install-root=$env:VCPKG_INSTALLED_DIR --clean-buildtrees-after-build --clean-packages-after-build

      # Saved right away, so a later failing step does not lose an hour of library builds
      - name: 'vcpkg: save the built libraries'
        if: always() && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}\vcpkg-binary-cache
          key: ${{ runner.os }}-pdffire-vcpkg-${{ hashFiles('pdf-fire/vcpkg.json') }}-${{ github.run_id }}

      - name: Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.3'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          dir: '${{ github.workspace }}/qt/'
          install-deps: 'true'
          modules: 'qtspeech qtmultimedia'
          cache: 'true'
          cache-key-prefix: ${{ runner.os }}-qt-6113
          # aqtinstall 3.3 cannot read the Windows repository layout of Qt 6.11+ (same pin as upstream PDF4QT)
          aqtsource: 'git+https://github.com/miurahr/aqtinstall.git@076e1659807d0b362a3ed684d54c2e9c775eb9c7'

      - name: Build
        working-directory: pdf-fire
        shell: pwsh
        run: |
          # The Microsoft C++ runtime goes next to the program (no separate Visual C++ Redistributable needed)
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $crt = Get-ChildItem "$vs\VC\Redist\MSVC\*\x64\Microsoft.VC*.CRT" -Directory | Sort-Object FullName | Select-Object -Last 1
          if (-not $crt) { throw 'the Microsoft C++ runtime (VC Redist CRT folder) was not found' }
          "C++ runtime: $($crt.FullName)"
          $env:MSVC_REDISTRIBUTABLES_PATH = $crt.FullName.Replace('\', '/')   # CMake reads \ as an escape
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -DCMAKE_VCPKG_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE="${env:VCPKG_ROOT}\scripts\buildsystems\vcpkg.cmake" `
            -DVCPKG_INSTALLED_DIR="${env:VCPKG_INSTALLED_DIR}" `
            -DPDF4QT_QT_ROOT="${env:QT_ROOT_DIR}" `
            -DPDF4QT_INSTALL_QT_DEPENDENCIES=ON -DPDF4QT_INSTALL_DEPENDENCIES=ON `
            -DPDF4QT_INSTALL_MSVC_REDISTRIBUTABLE=ON -DPDF4QT_INSTALL_TO_USR=ON `
            -DPDFFIRE_KOKORO_DIR="${env:PDFFIRE_WORK_DIR}\deps\kokoro"
          cmake --build build --target release_translations --config Release -j4
          cmake --build build --config Release -j4

      - name: Unit tests
        working-directory: pdf-fire
        shell: pwsh
        continue-on-error: true
        run: |
          $env:PATH = "$PWD\build\usr\bin\Release;$PWD\build\usr\bin\pdfplugins\Release;${env:VCPKG_INSTALLED_DIR}\x64-windows\bin;${env:QT_ROOT_DIR}\bin;$env:PATH"
          $env:PDFFIRE_SPEECH_MUTE = '1'
          # The normal Windows platform (it has the system fonts; "offscreen" has none on Windows)
          $env:QT_FORCE_STDERR_LOGGING = '1'
          $env:TESSDATA_PREFIX = Join-Path $env:PDFFIRE_WORK_DIR 'deps\tessdata'
          ctest --test-dir build -C Release --output-on-failure --timeout 300
          $ctestResult = $LASTEXITCODE
          # A failed test, run on its own: its exit code (0xC0000135 = a DLL is missing,
          # 0xC0000005 = a crash), its own report and the DLLs it needs
          $failed = Get-Content build\Testing\Temporary\LastTestsFailed.log -ErrorAction SilentlyContinue
          foreach ($line in $failed) {
            $name = ($line -split ':')[1]
            $exe = Get-ChildItem -Recurse build -Filter "$name.exe" | Select-Object -First 1
            if (-not $exe) { "$name - program not found"; continue }
            "===== $name ($($exe.FullName))"
            & $exe.FullName -o "$name.txt,txt" 2>&1 | Select-Object -Last 30
            '{0} exit code: 0x{1:X8}' -f $name, $LASTEXITCODE
            if (Test-Path "$name.txt") { Get-Content "$name.txt" | Select-String -Pattern 'FAIL!|Loc:|QWARN|QFATAL|QCRITICAL|Totals' | Select-Object -First 40 }
            $dumpbin = Get-ChildItem "${env:ProgramFiles}\Microsoft Visual Studio" -Recurse -Filter dumpbin.exe -ErrorAction SilentlyContinue | Where-Object { $_.FullName -match 'Hostx64\\x64' } | Select-Object -First 1
            if ($dumpbin) { & $dumpbin.FullName /dependents $exe.FullName | Select-String '\.dll' }
          }
          exit $ctestResult

      - name: Program folder
        working-directory: pdf-fire
        shell: pwsh
        run: |
          cmake --install build --config Release
          $bin = Join-Path $PWD 'build\install\usr\bin'
          New-Item -ItemType Directory -Force -Path "$bin\tessdata" | Out-Null
          Copy-Item (Join-Path $env:PDFFIRE_WORK_DIR 'deps\tessdata\eng.traineddata'), (Join-Path $env:PDFFIRE_WORK_DIR 'deps\tessdata\pdf.ttf') "$bin\tessdata\"
          Copy-Item LICENSE "$bin\LICENSE.txt"
          Copy-Item -Recurse 3rdparty_licenses "$bin\3rdparty_licenses"
          # The licence of every library vcpkg built (Tesseract, Leptonica, curl, libarchive, ...)
          $vcpkgLicenses = Join-Path $bin "3rdparty_licenses\vcpkg"
          New-Item -ItemType Directory -Force -Path $vcpkgLicenses | Out-Null
          Get-ChildItem "${env:VCPKG_INSTALLED_DIR}\x64-windows\share\*\copyright" | ForEach-Object {
            Copy-Item $_.FullName (Join-Path $vcpkgLicenses "$($_.Directory.Name).txt")
          }
          $count = (Get-ChildItem $vcpkgLicenses).Count
          "vcpkg licences: $count"
          if ($count -lt 10) { throw 'the licences of the vcpkg libraries are missing' }
          Get-ChildItem $bin | Format-Table Name, Length -AutoSize | Out-String -Width 200
          if (-not (Test-Path "$bin\voice\kokoro.onnx")) { throw 'the voice data is missing from the program folder' }
          if (-not (Test-Path "$bin\onnxruntime.dll")) { throw 'onnxruntime.dll is missing from the program folder' }
          foreach ($need in 'vcruntime140.dll', 'vcruntime140_1.dll', 'msvcp140.dll', 'multimedia', 'tls', 'tessdata\eng.traineddata', 'tessdata\pdf.ttf', 'platforms\qwindows.dll') {
            if (-not (Test-Path (Join-Path $bin $need))) { throw "$need is missing from the program folder" }
          }
          Get-ChildItem "$bin\multimedia", "$bin\tls" | Format-Table Name, Length -AutoSize | Out-String -Width 200

      - name: Smoke test (the installed program, as on a clean computer)
        working-directory: pdf-fire
        shell: pwsh
        run: |
          $bin = Join-Path $PWD 'build\install\usr\bin'
          $sandbox = Join-Path $env:RUNNER_TEMP 'smoke'
          New-Item -ItemType Directory -Force -Path $sandbox | Out-Null
          Copy-Item pdf-fire\tests\corpus\image_and_text.pdf $sandbox\
          $shot = Join-Path $sandbox 'pdf-fire-window.png'
          # Only Windows itself on the search path: every DLL must come from the program folder
          $env:PATH = "$env:SystemRoot\system32;$env:SystemRoot"
          $env:PDFFIRE_SCREENSHOT = $shot
          $env:PDFFIRE_SCRIPT_SANDBOX = $sandbox
          $env:PDFFIRE_SPEECH_MUTE = '1'
          $p = Start-Process -FilePath "$bin\Pdf4QtEditor.exe" -ArgumentList "`"$sandbox\image_and_text.pdf`"" -PassThru -RedirectStandardError "$sandbox\stderr.txt" -RedirectStandardOutput "$sandbox\stdout.txt"
          if (-not $p.WaitForExit(120000)) { $p.Kill(); throw 'PDF Fire did not finish within 2 minutes' }
          Get-Content "$sandbox\stdout.txt", "$sandbox\stderr.txt" -ErrorAction SilentlyContinue | Select-Object -Last 40
          'exit code: 0x{0:X8}' -f $p.ExitCode
          if ($p.ExitCode -ne 0) { throw 'PDF Fire did not start cleanly' }
          if (-not (Test-Path $shot)) { throw 'no screenshot - the window did not open' }

      - name: Upload the smoke-test screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test
          path: ${{ runner.temp }}\smoke
          retention-days: 7

      - name: Installer (Inno Setup)
        working-directory: pdf-fire
        shell: pwsh
        run: |
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          $version = (Get-Content pdf-fire\VERSION -Raw).Trim()
          "PDFFIRE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          $bin = Join-Path $PWD 'build\install\usr\bin'
          $out = Join-Path $PWD 'build\installer'
          & $iscc "/DAppVersion=$version" "/DSourceDir=$bin" "/O$out" packaging\pdf-fire\windows\pdf-fire.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed ($LASTEXITCODE)" }
          Get-ChildItem $out | Format-Table Name, Length -AutoSize | Out-String -Width 200
          Get-FileHash "$out\*.exe" -Algorithm SHA256 | Format-List

      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: PDF-Fire-Setup-${{ env.PDFFIRE_VERSION }}-x64
          path: pdf-fire\build\installer\*.exe
          retention-days: 30

      - name: Upload the program folder
        uses: actions/upload-artifact@v4
        with:
          name: PDF-Fire-windows-x64
          path: pdf-fire\build\install\usr\bin
          retention-days: 30
