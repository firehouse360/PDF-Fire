# PDF Fire - Windows: close and start again (Mike, 2026-10-03: "when I close the app and reopen
# it from the start menu it does not open"). Runs the program folder of an earlier build:
# open a PDF, close the window normally, check that the program really ends, then start it
# again without a document (as the Start menu does) and check that its window opens.
name: PDF Fire - Windows close and reopen

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Run of "PDF Fire - Windows", whose program folder is tested'
        required: true

permissions:
  contents: read
  actions: read

jobs:
  relaunch:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - name: Checkout PDF Fire (test documents)
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            pdf-fire/tests/corpus
            pdf-fire/tests/windows

      - name: Program folder of the build
        uses: actions/download-artifact@v4
        with:
          name: PDF-Fire-windows-x64
          path: ${{ runner.temp }}\program
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}

      - name: Open, close, open again
        shell: pwsh
        run: |
          $bin = Join-Path $env:RUNNER_TEMP 'program'
          $out = Join-Path $env:RUNNER_TEMP 'relaunch'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item pdf-fire\tests\corpus\image_and_text.pdf $out\
          $env:PATH = "$env:SystemRoot\system32;$env:SystemRoot"
          $env:PDFFIRE_SPEECH_MUTE = '1'
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          function Shot($name) {
              $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
              $bitmap = New-Object System.Drawing.Bitmap $bounds.Width, $bounds.Height
              $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
              $graphics.CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
              $bitmap.Save((Join-Path $out "$name.png"))
          }
          function Stacks($process, $name) {
              $cdb = 'C:\Program Files (x86)\Windows Kits\10\Debuggers\x64\cdb.exe'
              if (Test-Path $cdb) {
                  & $cdb -p $process.Id -pvr -c '.symfix; .reload; ~*k 30; qd' > (Join-Path $out "$name-stacks.txt") 2>&1
                  "stacks written: $name-stacks.txt"
              } else { 'cdb not found' }
          }

          "== 1. first start with a document"
          $first = Start-Process -FilePath "$bin\Pdf4QtEditor.exe" -ArgumentList "`"$out\image_and_text.pdf`"" -PassThru
          Start-Sleep -Seconds 25
          $first.Refresh()
          "running: $(-not $first.HasExited)  window: $($first.MainWindowHandle)  title: $($first.MainWindowTitle)"
          Shot '1-first'

          "== 2. close the window (as the X button)"
          $null = $first.CloseMainWindow()
          $ended = $first.WaitForExit(30000)
          "ended within 30 s: $ended"
          if (-not $ended) {
              $first.Refresh()
              "still running, threads: $($first.Threads.Count), window: $($first.MainWindowHandle)"
              Stacks $first 'after-close'
              Shot '2-after-close'
          } else {
              'exit code: 0x{0:X8}' -f $first.ExitCode
          }
          Get-Process Pdf4QtEditor -ErrorAction SilentlyContinue | Format-Table Id, StartTime, Threads, MainWindowTitle -AutoSize | Out-String -Width 200

          "== 3. start again without a document (as the Start menu)"
          $second = Start-Process -FilePath "$bin\Pdf4QtEditor.exe" -PassThru
          Start-Sleep -Seconds 25
          $second.Refresh()
          "running: $(-not $second.HasExited)  window: $($second.MainWindowHandle)  title: $($second.MainWindowTitle)"
          if ($second.HasExited) { 'exit code: 0x{0:X8}' -f $second.ExitCode }
          Shot '3-second'
          if (-not $second.HasExited -and $second.MainWindowHandle -eq 0) { Stacks $second 'second-start' }

          $failed = (-not $ended) -or $second.HasExited -or ($second.MainWindowHandle -eq 0)
          Get-Process Pdf4QtEditor -ErrorAction SilentlyContinue | Stop-Process -Force
          if ($failed) { throw 'PDF Fire did not close and open again properly - see the log, the stacks and the screenshots' }
          'OK: closed, and opened again'

      - name: Installer of the build
        uses: actions/download-artifact@v4
        with:
          pattern: PDF-Fire-Setup-*
          path: ${{ runner.temp }}\setup
          merge-multiple: true
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}

      - name: Installed for this user, started from the Start menu shortcut
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'relaunch'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item pdf-fire\tests\corpus\image_and_text.pdf (Join-Path $out 'installed.pdf')
          $setup = Get-ChildItem (Join-Path $env:RUNNER_TEMP 'setup') -Filter 'PDF-Fire-Setup-*.exe' | Select-Object -First 1
          "installer: $($setup.Name)"
          $install = Start-Process -FilePath $setup.FullName -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/CURRENTUSER', '/NORESTART', "/LOG=$out\install.log" -PassThru -Wait
          "installer exit code: $($install.ExitCode)"
          $lnk = Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs\PDF Fire.lnk'
          if (-not (Test-Path $lnk)) { Get-ChildItem (Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs') -Recurse | Select-Object FullName; throw 'no Start menu shortcut' }
          $shell = New-Object -ComObject WScript.Shell
          $shortcut = $shell.CreateShortcut($lnk)
          "shortcut: $($shortcut.TargetPath)  working dir: '$($shortcut.WorkingDirectory)'"
          function State($name) {
              $p = Get-Process Pdf4QtEditor -ErrorAction SilentlyContinue
              "$name : processes $(@($p).Count) ; windows: $((@($p) | ForEach-Object { $_.MainWindowTitle }) -join ' | ')"
          }

          "== A. start from the shortcut, open a document"
          Start-Process -FilePath $lnk
          Start-Sleep -Seconds 25
          State 'after start'
          $p = Get-Process Pdf4QtEditor | Select-Object -First 1
          Start-Process -FilePath $shortcut.TargetPath -ArgumentList "`"$out\installed.pdf`""
          Start-Sleep -Seconds 15
          State 'after opening a document'

          "== B. close every window"
          Get-Process Pdf4QtEditor -ErrorAction SilentlyContinue | ForEach-Object { $null = $_.CloseMainWindow() }
          Start-Sleep -Seconds 30
          State 'after close'
          $left = Get-Process Pdf4QtEditor -ErrorAction SilentlyContinue
          if ($left) {
              $cdb = 'C:\Program Files (x86)\Windows Kits\10\Debuggers\x64\cdb.exe'
              foreach ($q in $left) { & $cdb -p $q.Id -pvr -c '.symfix; .reload; ~*k 30; qd' > (Join-Path $out "installed-after-close-$($q.Id).txt") 2>&1 }
          }

          "== C. start again from the shortcut"
          Start-Process -FilePath $lnk
          Start-Sleep -Seconds 25
          State 'after second start'
          $windows = @(Get-Process Pdf4QtEditor -ErrorAction SilentlyContinue | Where-Object { $_.MainWindowHandle -ne 0 })
          Get-ChildItem (Join-Path $env:APPDATA 'PDF Fire') -Recurse -ErrorAction SilentlyContinue | Select-Object FullName, Length | Out-String -Width 200
          Get-Process Pdf4QtEditor -ErrorAction SilentlyContinue | Stop-Process -Force
          if ($left -or $windows.Count -eq 0) { throw 'installed PDF Fire did not close and open again properly' }
          'OK (installed): closed, and opened again from the Start menu'

      - name: With the settings of the report (installed, Start menu shortcut)
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'relaunch'
          $settingsDir = Join-Path $env:APPDATA 'PDF Fire'
          New-Item -ItemType Directory -Force -Path $settingsDir | Out-Null
          Copy-Item pdf-fire\tests\windows\settings-from-report.ini (Join-Path $settingsDir 'PDF Fire.ini') -Force
          $lnk = Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs\PDF Fire.lnk'
          Start-Process -FilePath $lnk
          Start-Sleep -Seconds 25
          $p = @(Get-Process Pdf4QtEditor -ErrorAction SilentlyContinue)
          "with the reported settings: processes $($p.Count) ; windows: $(($p | ForEach-Object { "$($_.MainWindowHandle)=$($_.MainWindowTitle)" }) -join ' | ')"
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bitmap = New-Object System.Drawing.Bitmap $bounds.Width, $bounds.Height
          [System.Drawing.Graphics]::FromImage($bitmap).CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
          $bitmap.Save((Join-Path $out 'reported-settings.png'))
          if ($p.Count -gt 0 -and ($p | Where-Object { $_.MainWindowHandle -eq 0 })) {
              $cdb = 'C:\Program Files (x86)\Windows Kits\10\Debuggers\x64\cdb.exe'
              foreach ($q in $p) { & $cdb -p $q.Id -pvr -c '.symfix; .reload; ~*k 30; qd' > (Join-Path $out "reported-settings-$($q.Id).txt") 2>&1 }
          }
          $ok = $p.Count -gt 0 -and -not ($p | Where-Object { $_.MainWindowHandle -eq 0 })
          $p | Stop-Process -Force -ErrorAction SilentlyContinue
          if (-not $ok) { throw 'PDF Fire did not open with the reported settings' }
          'OK: opens with the reported settings'

      - name: Close while reading aloud, then start again (Mike's steps)
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'relaunch'
          $sandbox = Join-Path $env:RUNNER_TEMP 'reading'
          New-Item -ItemType Directory -Force -Path $sandbox | Out-Null
          Copy-Item pdf-fire\tests\corpus\image_and_text.pdf (Join-Path $sandbox 'reading.pdf')
          Remove-Item (Join-Path $env:APPDATA 'PDF Fire'), (Join-Path $env:LOCALAPPDATA 'PDF Fire') -Recurse -Force -ErrorAction SilentlyContinue
          $lnk = Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs\PDF Fire.lnk'
          $exe = (New-Object -ComObject WScript.Shell).CreateShortcut($lnk).TargetPath
          $cdb = 'C:\Program Files (x86)\Windows Kits\10\Debuggers\x64\cdb.exe'
          function State($name) {
              $p = @(Get-Process Pdf4QtEditor -ErrorAction SilentlyContinue)
              "$name : processes $($p.Count) ; windows: $(($p | ForEach-Object { "$($_.Id):$($_.MainWindowHandle)=$($_.MainWindowTitle)" }) -join ' | ')"
          }

          "== R1. open a document, start reading aloud, close the window while it reads"
          $env:PDFFIRE_SCRIPT_SANDBOX = $sandbox
          $env:PDFFIRE_SCRIPT = 'size:1300x900;wait:3000;widget:speechButton;wait:1000;widget:speechPlayButton;wait:8000;action:actionQuit'
          $first = Start-Process -FilePath $exe -ArgumentList "`"$sandbox\reading.pdf`"" -PassThru
          Remove-Item Env:PDFFIRE_SCRIPT, Env:PDFFIRE_SCRIPT_SANDBOX
          $ended = $first.WaitForExit(60000)
          "ended within 60 s of starting: $ended"
          if ($ended) { 'exit code: 0x{0:X8}' -f $first.ExitCode } else {
              State 'still running'
              & $cdb -p $first.Id -pvr -c '.symfix; .reload; ~*k 40; qd' > (Join-Path $out 'reading-close-stacks.txt') 2>&1
          }
          "files left behind:"
          Get-ChildItem (Join-Path $env:APPDATA 'PDF Fire'), (Join-Path $env:LOCALAPPDATA 'PDF Fire') -Recurse -Force -ErrorAction SilentlyContinue | Select-Object FullName, Length, LastWriteTime | Out-String -Width 250
          Copy-Item (Join-Path $env:APPDATA 'PDF Fire') (Join-Path $out 'appdata-after-reading') -Recurse -ErrorAction SilentlyContinue
          Copy-Item (Join-Path $env:LOCALAPPDATA 'PDF Fire') (Join-Path $out 'localappdata-after-reading') -Recurse -ErrorAction SilentlyContinue

          "== R2. start again from the Start menu"
          Start-Process -FilePath $lnk
          Start-Sleep -Seconds 30
          State 'after the second start'
          $p = @(Get-Process Pdf4QtEditor -ErrorAction SilentlyContinue)
          foreach ($q in ($p | Where-Object { $_.MainWindowHandle -eq 0 })) {
              & $cdb -p $q.Id -pvr -c '.symfix; .reload; ~*k 40; qd' > (Join-Path $out "reading-second-start-$($q.Id).txt") 2>&1
              "stacks of $($q.Id) written"
          }
          $ok = $ended -and ($p | Where-Object { $_.MainWindowHandle -ne 0 })
          Get-Process Pdf4QtEditor -ErrorAction SilentlyContinue | Stop-Process -Force
          if (-not $ok) { throw 'REPRODUCED: after closing while reading aloud, PDF Fire does not open again' }
          'OK: closed while reading, and opened again'

      - name: With the settings saved after closing while reading (the broken file of the report)
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'relaunch'
          $docDir = Join-Path $env:USERPROFILE 'OneDrive\Test Folder\August'
          New-Item -ItemType Directory -Force -Path $docDir | Out-Null
          Copy-Item pdf-fire\tests\corpus\image_and_text.pdf (Join-Path $docDir 'report 8.4.26.pdf')
          Remove-Item (Join-Path $env:APPDATA 'PDF Fire'), (Join-Path $env:LOCALAPPDATA 'PDF Fire') -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path (Join-Path $env:APPDATA 'PDF Fire') | Out-Null
          Copy-Item pdf-fire\tests\windows\settings-after-reading.ini (Join-Path $env:APPDATA 'PDF Fire\PDF Fire.ini') -Force
          $lnk = Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs\PDF Fire.lnk'
          Start-Process -FilePath $lnk
          Start-Sleep -Seconds 30
          $p = @(Get-Process Pdf4QtEditor -ErrorAction SilentlyContinue)
          "with the broken settings: processes $($p.Count) ; windows: $(($p | ForEach-Object { "$($_.Id):$($_.MainWindowHandle)=$($_.MainWindowTitle)" }) -join ' | ')"
          $cdb = 'C:\Program Files (x86)\Windows Kits\10\Debuggers\x64\cdb.exe'
          foreach ($q in ($p | Where-Object { $_.MainWindowHandle -eq 0 })) {
              & $cdb -p $q.Id -pvr -c '.symfix; .reload; ~*k 40; qd' > (Join-Path $out "broken-settings-$($q.Id).txt") 2>&1
              "stacks of $($q.Id) written"
          }
          Get-WinEvent -FilterHashtable @{ LogName = 'Application'; StartTime = (Get-Date).AddMinutes(-3) } -ErrorAction SilentlyContinue |
              Where-Object { $_.Message -match 'Pdf4Qt|PDF Fire' } | Select-Object -First 5 TimeCreated, Id, ProviderName, Message | Format-List | Out-String -Width 250
          $ok = $p | Where-Object { $_.MainWindowHandle -ne 0 }
          Get-Process Pdf4QtEditor -ErrorAction SilentlyContinue | Stop-Process -Force
          if (-not $ok) { throw 'REPRODUCED: PDF Fire does not open with the settings of the report' }
          'OK: opens with the broken settings of the report'

      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relaunch-results
          path: ${{ runner.temp }}\relaunch
          retention-days: 7
